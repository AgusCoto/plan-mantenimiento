# Publicación en Netlify: arma la app con Vite y sirve dist/.
# Variables (Site configuration → Environment variables): VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Manifiesto con la marca del tema activo
[[redirects]]
  from = "/manifest.webmanifest"
  to = "/.netlify/functions/manifest"
  status = 200
  force = true

# Todas las rutas de la app (por ejemplo /e/PIN-APL-001, el enlace de las etiquetas) abren la app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
