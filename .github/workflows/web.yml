# Etiquetas viejas (W-Main): publica en GitHub Pages una página que lleva cada etiqueta vieja a la app nueva.
# Las etiquetas QR/NFC de W-Main apuntan a la dirección de GitHub Pages con el código después de «#».
# Se corre A MANO, una sola vez, cuando la app nueva ya esté publicada en Netlify (README → Pasar de W-Main
# a la app nueva). Antes de eso no se toca: W-Main sigue funcionando como hasta ahora.
# Necesita la variable del repositorio APP_URL (Settings → Secrets and variables → Actions → Variables),
# por ejemplo https://mantenimiento.netlify.app
name: Etiquetas viejas a la app nueva

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar la página de redirección
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ] || ! echo "$APP_URL" | grep -qE '^https://[^ ]+$'; then
            echo "::error::Falta la variable APP_URL (dirección de la app nueva, con https://)."; exit 1
          fi
          mkdir -p sitio/operarios
          sed "s#__APP_URL__#${APP_URL%/}#g" etiquetas-viejas/index.html > sitio/index.html
          cp sitio/index.html sitio/404.html
          cp sitio/index.html sitio/operarios/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: deployment
        uses: actions/deploy-pages@v4
