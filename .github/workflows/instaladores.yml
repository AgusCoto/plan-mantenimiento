# Genera los instaladores de Mac (.dmg) y Windows (.exe / .msi).
# Se ejecuta al crear una etiqueta de versión (por ejemplo v1.0.1) o a mano
# desde la pestaña Actions → "Instaladores" → Run workflow.
name: Instaladores

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run vendor

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseName: "W-Main ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}"
          releaseBody: "Descargá el instalador para tu sistema: .dmg para Mac, -setup.exe para Windows."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
