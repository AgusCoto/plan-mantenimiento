<style>
/* Layout: tablero de planta — barra superior fija con pestañas, lista de tareas ordenada por urgencia, detalle por equipo con horómetro */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --surface-2:#E3E9EB; --fg:#14212A; --muted:#566670; --line:#CDD6DA;

}

  --bg:#0E1418; --surface:#161F25; --surface-2:#1E2930; --fg:#E2E9ED; --muted:#93A3AD; --line:#2B3841;
  --accent:#4DB0B4; --accent-fg:#0B1417; --accent-soft:#183539;
  --bad:#F07065; --bad-soft:#3A1F1D; --warn:#F2C230; --warn-bar:#F2C230; --warn-soft:#352D12;
  --ok:#5FC38D; --ok-soft:#173022; --none:#8495A0; --none-soft:#222D34;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#161F25; --surface-2:#1E2930; --fg:#E2E9ED; --muted:#93A3AD; --line:#2B3841;
  --accent:#4DB0B4; --accent-fg:#0B1417; --accent-soft:#183539;
  --bad:#F07065; --bad-soft:#3A1F1D; --warn:#F2C230; --warn-bar:#F2C230; --warn-soft:#352D12;
  --ok:#5FC38D; --ok-soft:#173022; --none:#8495A0; --none-soft:#222D34;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}

.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.chip.A{background:var(--bad-soft);color:var(--bad)} .chip.B{background:var(--warn-soft);color:var(--warn)} .chip.C{background:var(--ok-soft);color:var(--ok)}
.chip.st-vencida{background:var(--bad-soft);color:var(--bad)} .chip.st-proxima{background:var(--warn-soft);color:var(--warn)} .chip.st-ok{background:var(--ok-soft);color:var(--ok)} .chip.st-sin{background:var(--none-soft);color:var(--none)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

  --accent:#5C9BF0;--accent-fg:#06142C;--accent-soft:#16294A;--navy:#0A1A36;--navy-2:#050E20;--shadow-sm:0 1px 2px rgba(0,0,0,.4)}}

  padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));overflow-y:auto}

const $=s=>document.querySelector(s);

function toUTC(s){const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)}
function fromUTC(t){const d=new Date(t);return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
function diffDays(a,b){return Math.round((toUTC(b)-toUTC(a))/864e5)}
function addInterval(s,v,u){
  const [y,m,d]=s.split("-").map(Number);
  if(u==="dias")return fromUTC(Date.UTC(y,m-1,d+v));
  if(u==="semanas")return fromUTC(Date.UTC(y,m-1,d+7*v));
  if(u==="meses"){const tm=m-1+v;const last=new Date(Date.UTC(y,tm+1,0)).getUTCDate();return fromUTC(Date.UTC(y,tm,Math.min(d,last)))}
  const last=new Date(Date.UTC(y+v,m,0)).getUTCDate();return fromUTC(Date.UTC(y+v,m-1,Math.min(d,last)));
}
const fmtD=s=>s?s.split("-").reverse().join("/"):"—";

  const parts=[];const m=t.modo||"tiempo";
  if(m!=="horas"&&n(t.cadaValor)){const v=n(t.cadaValor),u=t.cadaUnidad||"dias";
    const one={dias:"Diaria",semanas:"Semanal",meses:"Mensual",anios:"Anual"};
    parts.push(v===1?one[u]:"Cada "+v+" "+plural(v,u));}
  if(m!=="tiempo"&&n(t.cadaHoras))parts.push("Cada "+fmtN(t.cadaHoras)+" h");
  return parts.join(" o ")+(parts.length>1?" (lo primero)":"");
}

}
function curHours(eq){
  if(!eq||!isNum(eq.horometro))return {h:null};
  const hd=n(eq.horasDia)||0;const d=eq.horometroFecha?Math.max(0,diffDays(eq.horometroFecha,todayStr())):0;
  return {h:Number(eq.horometro)+hd*d,est:hd>0&&d>0,d};
}
function status(t){
  const eq=S.eq.get(t.equipoId);const today=todayStr();const m=t.modo||"tiempo";const partes=[];let falta="";
  if(m!=="horas"&&n(t.cadaValor)>0){
    if(t.ultimaFecha){
      const next=addInterval(t.ultimaFecha,n(t.cadaValor),t.cadaUnidad||"dias");
      const total=Math.max(1,diffDays(t.ultimaFecha,next));const rest=diffDays(today,next);
      const aviso=isNum(t.avisoDias)?Number(t.avisoDias):Math.min(14,Math.round(total*.15));
      partes.push({k:"t",next,rest,total,frac:rest/total,warn:rest<=aviso,due:rest<0,dias:rest});
    } else falta="Falta la fecha de la última realización";
  }
  if(m!=="tiempo"&&n(t.cadaHoras)>0){
    const cur=curHours(eq);
    if(cur.h===null)falta="Falta cargar el horómetro del equipo";
    else if(!isNum(t.ultimaHoras))falta="Falta el horómetro de la última realización";
    else{
      const nextH=Number(t.ultimaHoras)+n(t.cadaHoras);const rest=nextH-cur.h;
      const aviso=isNum(t.avisoHoras)?Number(t.avisoHoras):Math.round(n(t.cadaHoras)*.1);
      const hd=n(eq.horasDia)||0;
      partes.push({k:"h",nextH,rest,total:n(t.cadaHoras),frac:rest/n(t.cadaHoras),warn:rest<=aviso,due:rest<=0,dias:hd>0?rest/hd:null,est:cur.est});
    }
  }
  if(!partes.length)return {estado:"sin",partes,falta:falta||"Sin programación",key:9};

}
function partLabel(p){

  const on=b=>{const g=b.dataset.go;if(!g)return false;if(g==="historial")return S.view==="historial"&&(!b.dataset.ht||b.dataset.ht===ht);return g===S.view||(g==="equipos"&&S.view==="equipo")};
  document.querySelectorAll(".nav-item,.bottom-nav button").forEach(b=>{if(on(b))b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  let pg=PAGINAS[S.view]||["",""];
  if(S.view==="historial")pg=ht==="fallas"?["Buscar fallas anteriores","Encontrá cómo se resolvió un problema parecido y ganá tiempo"]:["Historial de intervenciones","Todo lo que se hizo en cada equipo"];
  if(S.view==="equipo"){const e=S.eq.get(S.eqId);pg=[e?e.nombre:"Equipo",e?e.codigo:""]}

function taskRow(t,showEq){

  else{
    when=st.partes.map(p=>{const l=partLabel(p);return '<div class="big">'+esc(l.big)+'</div><div class="sub">'+esc(l.sub)+'</div>'}).join("");
    when+='<div class="bar" aria-hidden="true"><i style="width:'+(elapsed(st)*100).toFixed(0)+'%"></i></div>';
  }

    '<div class="what">'+(showEq&&eq?'<div class="code">'+esc(eq.codigo)+' · '+esc(eq.nombre)+'</div>':'')+
    '<div class="tname">'+esc(t.nombre)+'</div>'+

}

/* ---------- checklist del fabricante ---------- */
function grpKey(it){return it.unidad==="horas"?100000+Number(it.cada):UNIT_DAYS[it.unidad||"dias"]*Number(it.cada)}
function grpLabel(it){const v=Number(it.cada),u=it.unidad||"dias";
  if(u==="horas")return "Cada "+fmtN(v)+" h de uso";
  const one={dias:"Diario",semanas:"Semanal",meses:"Mensual",anios:"Anual"};
  if(v===1)return one[u];if(u==="dias"&&v===15)return "Quincenal";if(u==="meses"&&v===3)return "Trimestral";if(u==="meses"&&v===6)return "Semestral";
  return "Cada "+v+" "+plural(v,u);}
function itemSt(it,eq){
  const last=(it.hist||[])[0];
  if(!last)return {st:"nunca",txt:"Sin registrar"};
  const when="Hecho el "+fmtD(last.f)+(isNum(last.h)?" · "+fmtN(last.h)+" h":"");
  if(it.unidad==="horas"){
    const cur=curHours(eq);
    if(cur.h===null||!isNum(last.h))return {st:"hecho",txt:when+" · falta horómetro para calcular"};
    const rest=Number(last.h)+Number(it.cada)-cur.h;
    return rest>0?{st:"hecho",txt:when+" · faltan "+fmtN(Math.round(rest))+" h"}:{st:"vencido",txt:when+" · vencido por "+fmtN(Math.round(-rest))+" h"};
  }
  const next=addInterval(last.f,Number(it.cada),it.unidad||"dias");const rest=diffDays(todayStr(),next);
  if(rest>0)return {st:"hecho",txt:when+(rest>1?" · vuelve a tocar el "+fmtD(next):" · vuelve a tocar mañana")};
  if(rest===0)return {st:"toca",txt:"Toca hoy · último "+fmtD(last.f)};
  return {st:"vencido",txt:"Vencido hace "+(-rest)+" "+(-rest===1?"día":"días")+" · último "+fmtD(last.f)};
}
function viewChecklist(e){
  const ck=S.ck.get(e.id);const items=(ck&&ck.items)||[];
  const aiBtn=S.smp?'<button class="btn w" data-act="ck-ai" data-id="'+esc(e.id)+'">Sugerir ítems con IA</button>':'';
  if(!items.length)return '<div class="empty"><h2>Sin checklist del fabricante</h2><p>Cargá los controles que indica el manual: qué revisar, cada cuánto y con qué valor de referencia. Después los vas tildando en cada ronda.</p><p style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary w" data-act="ck-edit" data-id="'+esc(e.id)+'">Cargar checklist</button>'+aiBtn+'</p></div>';
  const groups=new Map();items.slice().sort((a,b)=>grpKey(a)-grpKey(b)).forEach(it=>{const k=grpLabel(it);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(it)});
  const done=items.filter(it=>itemSt(it,e).st==="hecho").length;

/* Búsqueda por palabras clave: todas tienen que aparecer (sin importar acentos ni mayúsculas) */
function buscarCasos(q,f){
  const terms=normT(q).split(/\s+/).filter(Boolean);
  let list=casosFalla().filter(c=>(!f.tipo||c.tipo===f.tipo)&&(!f.resueltas||(!c.abierta&&(c.solucion||c.causa)))&&(!S.empresa||(c.eq&&c.eq.empresa===S.empresa)));
  if(terms.length)list=list.filter(c=>terms.every(t=>c.txt.includes(t)));
  return {terms,list:list.sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)))};
}
/* Casos parecidos a una descripción nueva: comparte palabras (por raíz de 5 letras), suma si es el mismo equipo o tipo */
function similares(desc,eqId,excluir,max){
  const raiz=w=>w.slice(0,5);const qs=[...new Set(palabras(desc).map(raiz))];if(!qs.length)return [];
  const e=S.eq.get(eqId);const tipo=e?eqParts(e).tipo:"";
  return casosFalla().filter(c=>!c.abierta&&c.k!==excluir&&(c.solucion||c.causa)).map(c=>{
    const set=new Set(palabras(c.desc+" "+c.causa+" "+c.solucion).map(raiz));const hits=qs.filter(w=>set.has(w)).length;
    return {c,hits,score:hits*3+(c.equipoId===eqId?2:0)+(tipo&&c.tipo===tipo?1:0)}}).filter(x=>x.hits>0)
    .sort((a,b)=>b.score-a.score||String(b.c.fecha).localeCompare(String(a.c.fecha))).slice(0,max||3).map(x=>x.c);
}
function hl(t,terms){
  let h=esc(t);if(!terms||!terms.length)return h;
  const fx=w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/a/g,"[aá]").replace(/e/g,"[eé]").replace(/i/g,"[ií]").replace(/o/g,"[oó]").replace(/u/g,"[uúü]").replace(/n/g,"[nñ]");
  try{h=h.replace(new RegExp("("+terms.map(fx).join("|")+")","gi"),"<mark>$1</mark>")}catch(_){}
  return h;
}

function abrirToken(raw){
  if(/#conectar=/.test(String(raw)))return toast("Ese es el QR de conexión: ya estás conectado."),stopScan(),render(),true;
  let tok=String(raw||"").trim();if(tok.includes("#"))tok=tok.split("#").pop();
  try{tok=decodeURIComponent(tok)}catch(_){}
  const e=findByToken(tok);
  if(!e){toast("No encontré ningún equipo con “"+tok+"”.");return false}
  stopScan();S.view="equipo";S.eqId=e.id;S.eqTab=((S.ck.get(e.id)||{}).items||[]).length?"check":"plan";closeModal();render();window.scrollTo(0,0);toast("Equipo identificado: "+e.codigo);
  if(navigator.vibrate)try{navigator.vibrate(80)}catch(_){}
  return true;
}
let scanStream=null,scanRaf=0;
async function startScan(){
  const live=$("#scan-live");if(!live)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast("Este dispositivo no permite usar la cámara desde la aplicación.");return}
  live.innerHTML='<div class="cam"><video id="sc-v" playsinline muted></video><div class="frame"></div></div><p class="hint" style="text-align:center">Centrá el código QR en el recuadro.</p><p style="text-align:center"><button class="btn" data-act="scan-stop">Cancelar</button></p>';
  $("#scan-opts").hidden=true;
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false})}
  catch(x){live.innerHTML='<div class="banner">No se pudo abrir la cámara. Revisá que la aplicación tenga permiso para usarla.</div>';$("#scan-opts").hidden=false;return}
  const v=$("#sc-v");v.srcObject=scanStream;await v.play().catch(()=>{});
  const c=document.createElement("canvas");const ctx=c.getContext("2d",{willReadFrequently:true});
  const tick=()=>{if(!scanStream)return;
    if(v.readyState>=2&&v.videoWidth){const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);c.width=w;c.height=h;ctx.drawImage(v,0,0,w,h);
      const img=ctx.getImageData(0,0,w,h);const r=window.jsQR&&window.jsQR(img.data,w,h,{inversionAttempts:"dontInvert"});
      if(r&&r.data){if(abrirToken(r.data))return}}
    scanRaf=requestAnimationFrame(tick)};
  tick();
}
function stopScan(){cancelAnimationFrame(scanRaf);if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
async function leerNFC(){
  if(!hayNFC()){toast("Este celular no permite leer NFC desde la aplicación.");return}
  try{const r=new NDEFReader();await r.scan();toast("Acercá el celular a la etiqueta…");
    r.onreading=ev=>{for(const rec of ev.message.records){const t=new TextDecoder().decode(rec.data);if(rec.recordType==="url"||rec.recordType==="text"||rec.recordType==="absolute-url"){if(abrirToken(t))return}}toast("La etiqueta no tiene un código de equipo.")};
    r.onreadingerror=()=>toast("No se pudo leer la etiqueta. Probá de nuevo.");
  }catch(x){toast(x&&x.name==="NotAllowedError"?"Hay que permitir el uso de NFC.":"No se pudo activar NFC: revisá que esté encendido.")}
}
async function grabarNFC(link){
  if(!hayNFC()){toast("Grabar NFC desde la aplicación funciona en Android con Chrome.");return}
  try{toast("Acercá la etiqueta NFC al celular…");await new NDEFReader().write({records:[{recordType:"url",data:link}]});toast("Etiqueta grabada")}
  catch(x){toast(x&&x.name==="NotAllowedError"?"Hay que permitir el uso de NFC.":"No se pudo grabar la etiqueta.")}
}

function saveTipos(list){

/* Cambia tipo y número de un equipo guardando el código y el ID anteriores (las etiquetas viejas siguen funcionando) */
function recodeTipo(e,tipo,num){
  const p=eqParts(e);
  return S.db.doc("equipos/"+e.id).update({tipo,numero:num,idActivo:idAct(tipo,num),codigo:codeOf(p.empresa,p.area,tipo,num),
    codigosAnteriores:[...new Set([...(e.codigosAnteriores||[]),e.codigo,e.idActivo].filter(Boolean))]});
}
const eqDeTipo=k=>[...S.eq.values()].filter(e=>eqParts(e).tipo===k).sort((a,b)=>(eqParts(a).numero||0)-(eqParts(b).numero||0));
function formEditTipo(k){
  const info=tipoInfo(k)||{d:"",movil:false};const afect=eqDeTipo(k);
  openModal(mhead("Editar tipo de equipo")+'<form id="frm" class="fg" novalidate>'+
  '<label class="f"><span>Código (3 letras) *</span><input id="et-c" maxlength="3" value="'+esc(k)+'" style="text-transform:uppercase"></label>'+
  '<label class="f"><span>Nombre *</span><input id="et-d" value="'+esc(info.d)+'"></label>'+
  '<label class="f full" style="flex-direction:row;align-items:center;gap:8px;color:var(--fg)"><input type="checkbox" id="et-mv" style="width:auto"'+(info.movil?' checked':'')+'> Es un tipo de equipo móvil (puede pasar de una empresa a otra)</label>'+
  '<div class="code-prev full" id="et-prev"></div>'+
  '<div class="err full" id="err"></div><div class="m-acts full"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary" id="et-save">Guardar</button></div></form>',
  r=>{const g=id=>r.querySelector("#"+id);
    const upd=()=>{const c=g("et-c").value.trim().toUpperCase();const ej=afect[0];
      g("et-prev").innerHTML=(c===k||!c)?'<span class="hint">'+(afect.length?afect.length+(afect.length===1?' equipo usa':' equipos usan')+' este tipo.':'Ningún equipo usa este tipo todavía.')+'</span>':
        '<b>Se van a recodificar '+afect.length+(afect.length===1?' equipo':' equipos')+'.</b>'+(ej?' <span class="hint">Ejemplo:</span> <span class="code">'+esc(ej.codigo)+'</span> → <b class="code">'+esc((()=>{const p=eqParts(ej);return codeOf(p.empresa,p.area,c,p.numero)})())+'</b>':'')+
        '<br><span class="hint">El tipo es parte del ID permanente (ej. '+esc(k)+'-001 → '+esc(c)+'-001). Las etiquetas NFC/QR ya grabadas siguen abriendo el equipo, porque el ID anterior queda guardado; las nuevas etiquetas salen con el ID nuevo.</span>'};
    g("et-c").addEventListener("input",upd);upd();
    g("frm").addEventListener("submit",async ev=>{ev.preventDefault();
      const err=g("err"),btn=g("et-save");const c=g("et-c").value.trim().toUpperCase(),d=val("et-d"),mv=g("et-mv").checked;
      if(!/^[A-Z]{3}$/.test(c)){err.textContent="El código tiene que tener exactamente 3 letras.";return}
      if(!d){err.textContent="Escribí el nombre.";return}
      const lista=tipos();
      if(c!==k&&lista.some(([x])=>x===c)){err.textContent="El tipo "+c+" ya existe. Para juntar dos tipos usá “Eliminar” en uno de ellos y pasá sus equipos al otro.";return}
      btn.disabled=true;
      try{
        if(c!==k){
          /* si el código nuevo ya se usó antes, se numera a continuación para no repetir IDs de etiquetas viejas */
          const base=nextNum(c)-1;let i=0;

            await recodeTipo(e,c,base?base+i:eqParts(e).numero)}
        }
        btn.textContent="Guardando…";
        await saveTipos(lista.map(([x,y])=>x===k?[c,{d,movil:mv}]:[x,y]));
        closeModal();toast(c!==k?"Tipo "+k+" → "+c+" · "+afect.length+(afect.length===1?" equipo recodificado":" equipos recodificados"):"Tipo actualizado");render();
      }catch(x){btn.disabled=false;btn.textContent="Guardar";writeErr(x);err.textContent="No se completó el cambio. Volvé a intentar: los equipos que ya se recodificaron no se tocan de nuevo."}
    });
  });
}

  '<label class="f"><span>Resultado</span><select id="r-res">'+RESULTADOS.map(x=>'<option>'+x+'</option>').join("")+'</select></label>'+
  '<label class="f full" id="g-prov" hidden><span>Taller / proveedor al que se envió</span><input id="r-prov"></label>'+
  '<label class="f full"><span>Repuestos usados</span><input id="r-rep"></label>'+
  '<label class="f full"><span>Observaciones (qué se encontró, causa de la falla)</span><textarea id="r-obs"></textarea></label>'+
  '<div class="err full" id="err"></div>'+
  '<div class="m-acts full"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary">Guardar registro</button></div></form>',
  r=>{
    const sel=r.querySelector("#r-tarea");if(sel)sel.addEventListener("change",()=>{r.querySelector("#g-rt").hidden=!!sel.value});
    const rs=r.querySelector("#r-res");rs.addEventListener("change",()=>{r.querySelector("#g-prov").hidden=rs.value!=="Enviado a reparación externa"});
    r.querySelector("#frm").addEventListener("submit",async ev=>{ev.preventDefault();
      const tarea=t||(sel&&sel.value?S.ta.get(sel.value):null);
      const fecha=val("r-fecha");const hm=numVal("r-hm");const par=numVal("r-par");const err=$("#err");
      if(!fecha){err.textContent="Indicá la fecha.";return}
      if((hm!==null&&!isFinite(hm))||(par!==null&&!isFinite(par))){err.textContent="Horómetro y parada tienen que ser números.";return}
      if(tarea&&tarea.modo!=="tiempo"&&hm===null){err.textContent="Esta tarea se programa por horas: anotá el horómetro.";return}
      const dur=numVal("r-dur");if(dur!==null&&!isFinite(dur)){err.textContent="La duración tiene que ser un número.";return}
      const resultado=val("r-res");
      const reg={equipoId:e.id,equipoCodigo:e.codigo,tareaId:tarea?tarea.id:null,tareaNombre:tarea?tarea.nombre:"Intervención no programada",
        tipo:tarea?"Preventivo":val("r-tipo"),fecha,horometro:hm,tecnico:val("r-tec"),duracion:dur,parada:par,resultado,
        proveedor:resultado==="Enviado a reparación externa"?val("r-prov"):"",repuestos:val("r-rep"),obs:val("r-obs"),
        porId:S.me&&S.me.id||null,creado:new Date().toISOString()};
      if(resultado==="Resuelto")reg.fechaCierre=fecha;
      if(tarea){reg.prevUltimaFecha=tarea.ultimaFecha||null;reg.prevUltimaHoras=isNum(tarea.ultimaHoras)?Number(tarea.ultimaHoras):null;}
      if(tarea){const st=status(tarea);reg.atrasoDias=0;reg.atrasoHoras=0;
        for(const p of st.partes){
          if(p.k==="t"){reg.venceEl=p.next;reg.atrasoDias=Math.max(0,diffDays(p.next,fecha))}
          if(p.k==="h"&&hm!==null){reg.venceHoras=p.nextH;reg.atrasoHoras=Math.max(0,Math.round(hm-p.nextH))}
        }
        reg.demorada=reg.atrasoDias>0||reg.atrasoHoras>0}
      const guardar=async(db,f)=>{
        if(f){reg.porId=f.id;reg.otId=ot.id;reg.otNumero=ot.numero||null}
        const ref=await db.collection("registros").add(reg);
        const eo={"Enviado a reparación externa":"En reparación externa","Equipo fuera de servicio":"Fuera de servicio","Pendiente de repuesto":"Esperando repuesto","Resuelto":"Operativo"}[resultado];
        if(eo&&!(tarea&&resultado==="Resuelto")&&(eo!==(e.estadoOp||"Operativo")))await db.doc("equipos/"+e.id).update({estadoOp:eo});
        if(tarea){const up={};
          if(!tarea.ultimaFecha||fecha>=tarea.ultimaFecha){up.ultimaFecha=fecha;if(hm!==null)up.ultimaHoras=hm}
          if(Object.keys(up).length)await db.doc("tareas/"+tarea.id).update(up)}
        if(hm!==null)await updHorometro(e,hm,fecha,db);
        if(f)await db.doc("ots/"+ot.id).update({estado:"Cerrada",estadoAnterior:ot.estado,cierre:new Date().toISOString(),registroId:ref.id,historial:addHist(ot,histEntry(f,estLbl(ot.estado)+" → Terminada",{resultado}))});
      };
      try{
        if(ot){const ok=await conFirma("terminar "+otNum(ot),otDetalle(ot),guardar);if(!ok)return}
        else await guardar(S.db,null);
        closeModal();toast(ot?otNum(ot)+" terminada y registrada":"Registro guardado");render();
      }catch(x){firmaErr(x)}
    });
  });
}
async function updHorometro(e,hm,fecha,db){db=db||S.db;
  if(e.horometroFecha&&fecha<e.horometroFecha)return;
  const up={horometro:hm,horometroFecha:fecha};
  if(e.usoAuto!==false&&isNum(e.horometro)&&e.horometroFecha){const d=diffDays(e.horometroFecha,fecha);const dh=hm-Number(e.horometro);
    if(d>=1&&dh>=0&&dh/d<=24)up.horasDia=Math.round(dh/d*10)/10}

const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function mesLabel(m){const [y,mo]=m.split("-").map(Number);return MESES[mo-1]+" "+y}
function reportData(m){
  const [y,mo]=m.split("-").map(Number);const a=m+"-01";const b=fromUTC(Date.UTC(y,mo,0));const hoy=todayStr();const fin=b<hoy?b:hoy;
  const inEmp=id=>{const e=S.eq.get(id);return !S.empresa||(e?e.empresa===S.empresa:false)};
  const enMes=S.re.filter(r=>r.fecha>=a&&r.fecha<=b).sort((x,z)=>x.fecha<z.fecha?-1:1);
  const regs=enMes.filter(r=>!MOV.has(r.tipo)&&inEmp(r.equipoId));
  const movs=enMes.filter(r=>MOV.has(r.tipo)&&(!S.empresa||r.empresaDesde===S.empresa||r.empresaHacia===S.empresa||inEmp(r.equipoId)));
  const sum=(arr,f)=>arr.reduce((s,x)=>s+(Number(x[f])||0),0);
  const prev=regs.filter(r=>r.tipo==="Preventivo"),corr=regs.filter(r=>r.tipo==="Correctivo");
  const medidas=prev.filter(r=>typeof r.demorada==="boolean");const dem=medidas.filter(r=>r.demorada);
  const eqName=id=>{const e=S.eq.get(id);return e?{codigo:e.codigo,nombre:e.nombre,empresa:e.empresa}:{codigo:"(eliminado)",nombre:"",empresa:""}};
  const byEq=new Map();regs.forEach(r=>{const o=byEq.get(r.equipoId)||Object.assign({n:0,corr:0,parada:0,trabajo:0},eqName(r.equipoId));
    o.n++;if(r.tipo==="Correctivo")o.corr++;o.parada+=Number(r.parada)||0;o.trabajo+=Number(r.duracion)||0;byEq.set(r.equipoId,o)});
  const byEmp={};Object.keys(EMP).forEach(k=>byEmp[k]={n:0,prev:0,corr:0,parada:0,trabajo:0});
  regs.forEach(r=>{const k=eqName(r.equipoId).empresa;if(!byEmp[k])return;const o=byEmp[k];o.n++;if(r.tipo==="Preventivo")o.prev++;if(r.tipo==="Correctivo")o.corr++;o.parada+=Number(r.parada)||0;o.trabajo+=Number(r.duracion)||0});
  const reps=S.re.filter(r=>r.resultado&&r.resultado!=="Resuelto"&&r.fecha<=b&&inEmp(r.equipoId)&&(r.fecha>=a||!r.fechaCierre||r.fechaCierre>=a))
    .map(r=>{const cerr=r.fechaCierre&&r.fechaCierre<=b;return Object.assign({},r,eqName(r.equipoId),{cerrada:!!cerr,dias:diffDays(r.fecha,cerr?r.fechaCierre:fin)})});
  const venc=[...S.ta.values()].filter(t=>isActivo(S.eq.get(t.equipoId))&&inEmp(t.equipoId)).map(t=>({t,st:status(t)})).filter(x=>x.st.estado==="vencida").map(x=>Object.assign({tarea:x.t.nombre,freq:freqLabel(x.t),txt:partLabel(x.st.gov).big},eqName(x.t.equipoId)));
  let ck=0;for(const [id,c] of S.ck)if(inEmp(id))for(const it of c.items||[])for(const hh of it.hist||[])if(hh.f>=a&&hh.f<=b)ck++;
  const fueraServ=[...S.eq.values()].filter(e=>isActivo(e)&&inEmp(e.id)&&e.estadoOp&&e.estadoOp!=="Operativo");
  const tipos={};regs.forEach(r=>{tipos[r.tipo||"Otro"]=(tipos[r.tipo||"Otro"]||0)+1});
  const paradaCorr=sum(corr,"parada");
  return {m,a,b,parcial:b>=hoy,regs,prev,corr,medidas,dem,parada:sum(regs,"parada"),trabajo:sum(regs,"duracion"),
    mttr:corr.length?paradaCorr/corr.length:null,aTiempo:medidas.length?(medidas.length-dem.length)/medidas.length:null,
    otsMes:[...S.ot.values()].filter(o=>{if(esPrev(o)||o.estado==="Anulada")return false;const f=String(o.reportado||"").slice(0,10);return f>=a&&f<=b&&(!S.empresa||inEmp(o.equipoId))}),
    movs,byEq:[...byEq.values()].sort((x,z)=>z.parada-x.parada||z.n-x.n),byEmp,reps,venc,ck,fueraServ,tipos};
}

/* ---------- urgencia de fallas ---------- */
function holgura(e){
  const p=(e&&e.prod)||{};if(isNum(p.holguraManual))return Number(p.holguraManual);
  const C=n(p.cap),D=n(p.dem),H=n(p.hdisp),St=n(p.stock)||0,d=isNum(p.dias)?Number(p.dias):5;
  if(!(C>0)||D===null||!(H>0))return null;
  return Math.max(0,Math.round((St/C+(H-D/C)*d)*10)/10);
}
function calcUrg(f,e){
  const crit=e&&e.criticidad,res=!!(e&&e.prod&&e.prod.reserva);
  const p=f.tipo==="menor"?0:(isNum(f.perdida)?Math.min(100,Math.max(0,Number(f.perdida))):100);
  const T=n(f.tEst),h=holgura(e),lost=T!==null?Math.round(T*p)/100:null;let u,why;
  if(f.tipo==="seg"){u="U1";why="Hay riesgo para personas, para la inocuidad o para el ambiente."}
  else if(p===0){u=crit==="A"?"U3":"U4";why="No afecta la producción"+(crit==="A"?", pero es un equipo crítico.":".")}
  else if(h!==null&&lost!==null){
    const q=p/100,L=r=>Math.round((r+T)*q*10)/10;
    if(L(URG.U3.resp)<h){u="U3";why="Aun esperando hasta 3 días para empezar, se pierden "+fmtN(L(URG.U3.resp))+" h y la holgura es de "+fmtN(h)+" h: no se afectan entregas."}
    else if(L(URG.U2.resp)<h){u="U2";why="Si se espera más de un turno se consume la holgura ("+fmtN(h)+" h); atendiendo en el turno se pierden "+fmtN(L(URG.U2.resp))+" h."}
    else if(L(URG.U1.resp)<h){u="U1";why="Hay que empezar en menos de 1 h: con la reparación ("+fmtN(T)+" h) casi no queda holgura ("+fmtN(h)+" h)."}
    else{u="U1";why="Aun atendiendo de inmediato se pierden "+fmtN(L(URG.U1.resp))+" h y la holgura es de "+fmtN(h)+" h: se van a afectar entregas. Avisar a producción y comercial."}
  }else{u=p>=100?(crit==="A"?"U1":"U2"):"U3";why=h===null?"El equipo no tiene cargados datos de producción y demanda: se decide por criticidad"+(crit?" ("+crit+")":"")+".":"Falta el tiempo estimado de reparación."}
  if(res&&f.tipo!=="seg"&&(u==="U1"||u==="U2")){u=u==="U1"?"U2":"U3";why+=" Tiene equipo de reserva: baja un nivel."}
  return {u,why,lost,h,p};
}
const urgOf=o=>o.urgManual||o.urg||"U3";
function hoursSince(iso){return (Date.now()-new Date(iso).getTime())/36e5}
function fmtH(h){if(h<1)return Math.max(1,Math.round(h*60))+" min";if(h<48)return fmtN(Math.round(h*10)/10)+" h";return Math.round(h/24)+" días"}
function otState(o){
  const u=urgOf(o),el=hoursSince(o.reportado),meta=URG[u].resp;
  const respRef=o.inicio?(new Date(o.inicio)-new Date(o.reportado))/36e5:el;
  const respOk=respRef<=meta;
  let riesgo=null;
  if(isNum(o.holgura)&&o.perdida>0){const rest=Number(o.holgura)-el*o.perdida/100;riesgo=rest<=0?"Ya afecta las entregas":"Entregas en riesgo en "+fmtH(rest*100/o.perdida)}
  return {u,el,meta,respOk,riesgo};
}
function urgChip(u,big){return '<span class="uchip '+u.toLowerCase()+(big?' big':'')+'" title="'+esc(URG[u].l+" · "+URG[u].meta)+'">'+u+' · '+esc(URG[u].l)+'</span>'}

/* Pide usuario y contraseña del técnico que hace el cambio. Devuelve {db,id,name,cerrar} o null si se cancela */
function firmar(titulo,detalle){
  return new Promise(async resolve=>{
    const root=$("#firma-root");let lista=[];
    try{lista=S.user?await S.user.firmantes():[]}catch(_){}
    const done=v=>{root.innerHTML="";resolve(v)};
    const def=lista.find(x=>S.me&&x.id===S.me.id)?S.me.id:"";
    root.innerHTML='<div class="overlay"><div class="modal" role="dialog" aria-modal="true" style="max-width:460px">'+mhead("Firmar: "+titulo).replace('data-act="close"','data-act="firma-cancel"')+
      '<form id="fz" class="fg" novalidate>'+(detalle?'<div class="code-prev full">'+detalle+'</div>':'')+
      '<label class="f full"><span>Técnico responsable *</span><select id="fz-u"><option value="">Elegí…</option>'+lista.map(x=>'<option value="'+esc(x.id)+'"'+(x.id===def?' selected':'')+'>'+esc(x.nombre||x.email)+(x.rol==="admin"?" (administrador)":"")+'</option>').join("")+'</select></label>'+
      '<label class="f full"><span>Contraseña *</span><input type="password" id="fz-p" autocomplete="off"></label>'+
      '<p class="hint full" style="margin:0">El cambio queda registrado a nombre de quien firma, con fecha y hora. Es la misma contraseña con la que entra al programa.</p>'+
      '<div class="err full" id="fz-err"></div><div class="m-acts full"><button type="button" class="btn" data-act="firma-cancel">Cancelar</button><button type="submit" class="btn primary" id="fz-ok">Firmar y guardar</button></div></form></div></div>';
    const g=id=>root.querySelector("#"+id);
    root.querySelectorAll('[data-act="firma-cancel"]').forEach(b=>b.addEventListener("click",ev=>{ev.stopPropagation();done(null)}));
    (def?g("fz-p"):g("fz-u")).focus();
    g("fz").addEventListener("submit",async ev=>{ev.preventDefault();ev.stopPropagation();
      const u=lista.find(x=>x.id===g("fz-u").value);const pw=g("fz-p").value;
      if(!u){g("fz-err").textContent="Elegí quién firma.";return}
      if(!pw){g("fz-err").textContent="Escribí la contraseña.";return}
      g("fz-ok").disabled=true;g("fz-ok").textContent="Verificando…";
      try{const v=await S.user.verificar(u.email,pw);done({id:v.id,name:v.name,rol:v.rol,db:S.db.as(v.cliente),cerrar:v.cerrar})}
      catch(x){g("fz-ok").disabled=false;g("fz-ok").textContent="Firmar y guardar";g("fz-p").value="";g("fz-p").focus();
        g("fz-err").textContent=x&&x.code==="bad_password"?"Contraseña incorrecta.":(x&&x.message)||"No se pudo verificar."}
    });
  });
}
/* Ejecuta fn(db, firmante) con la sesión del técnico que firmó; devuelve false si se canceló */
async function conFirma(titulo,detalle,fn){
  const f=await firmar(titulo,detalle);if(!f)return false;
  try{await fn(f.db,f)}finally{f.cerrar()}
  return true;
}

const safe=s=>String(s||"").replace(/[^\w\-áéíóúñÁÉÍÓÚÑ ]+/g,"").trim().replace(/\s+/g,"_").slice(0,60);
function csv(){
  const rows=[["Fecha","Código","Equipo","Empresa","Tarea","Tipo","Resultado","Demorada","Horómetro","Técnico","Horas trabajo","Horas parada","Taller / proveedor","Fecha cierre","Repuestos","Observaciones"]];
  S.re.forEach(r=>{const e=S.eq.get(r.equipoId);if(S.empresa&&(!e||e.empresa!==S.empresa))return;
    if(S.view==="informe"&&(r.fecha<S.mes+"-01"||r.fecha>S.mes+"-31"))return;
    rows.push([r.fecha,e?e.codigo:r.equipoCodigo||"",e?e.nombre:"",e?e.empresa:"",r.tareaNombre,r.tipo,r.resultado||"",r.demorada?"Sí":"",r.horometro??"",r.tecnico,r.duracion??"",r.parada??"",r.proveedor||"",r.fechaCierre||"",r.repuestos||"",r.obs])});
  return "﻿"+rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(";")).join("\r\n");
}

/* ---------- eventos ---------- */
document.addEventListener("click",async ev=>{
  const go=ev.target.closest("[data-go]");if(go){if(S.view==="escanear"&&go.dataset.go!=="escanear")stopScan();S.view=go.dataset.go;if(go.dataset.ht)S.histTab=go.dataset.ht;S.filtroEstado="";
    document.body.classList.remove("side-open");closeModal();render();window.scrollTo(0,0);return}
  const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="ov"&&ev.target!==b)return;
  if(!S.db&&!["ov","close","filtro","open-eq","ins","eqtab","ck-row-add","ck-row-del","tag","copy-link"].includes(a)){toast("Sin conexión con la base de datos.");return}
  if(ADMIN_ACTS.has(a)&&!S.isAdmin){toast("Solo un administrador puede hacer esto.");return}
  if(WRITE_ACTS.has(a)&&!canW()){toast("Tu usuario es de solo lectura. Pedile al administrador que te asigne el rol Técnico.");return}
  switch(a){
    case "ov":case "close":closeModal();break;
    case "filtro":S.filtroEstado=S.filtroEstado===b.dataset.k?"":b.dataset.k;render();break;
    case "new-eq":formEquipo();break;
    case "open-eq":S.view="equipo";S.eqId=id;S.eqTab="plan";render();window.scrollTo(0,0);break;
    case "edit-eq":formEquipo(S.eq.get(id));break;
    case "del-eq":confirmDel(S.eq.get(id));break;
    case "del-eq-ok":{b.disabled=true;try{for(const t of tasksOf(id))await S.db.doc("tareas/"+t.id).delete();await S.db.doc("equipos/"+id).delete();closeModal();S.view="equipos";toast("Equipo eliminado");render()}catch(x){writeErr(x);b.disabled=false}break}
    case "new-task":formTarea(null,id||null);break;
    case "edit-task":formTarea(S.ta.get(id));break;
    case "del-task":formDelTask(S.ta.get(id));break;
    case "ot-anular":formAnularOT(S.ot.get(id));break;
    case "ot-editprev":formEditPrev(S.ot.get(id));break;
    case "reg-edit":formEditReg(S.re.find(x=>x.id===id));break;
    case "reg-del":formDelReg(S.re.find(x=>x.id===id));break;
    case "ins":showIns(S.ta.get(id));break;
    case "reg":formRegistro(S.ta.get(id));break;
    case "reg-eq":formRegistro(null,id);break;
    case "hm":formHorometro(S.eq.get(id));break;
    case "dl-ins":{const t=S.ta.get(id),e=S.eq.get(t.equipoId);save("Instructivo_"+safe(e.codigo)+"_"+safe(t.nombre)+".html",printableDoc(e,[t]));break}
    case "dl-eq":{const e=S.eq.get(id);save("Ficha_"+safe(e.codigo)+".html",printableDoc(e,tasksOf(id).sort((x,y)=>String(x.nombre).localeCompare(String(y.nombre)))));break}
    case "eqtab":S.eqTab=b.dataset.k;render();break;
    case "histtab":S.histTab=b.dataset.k;render();break;
    case "ot-sim":{const o=S.ot.get(id);if(!o)break;const e=S.eq.get(o.equipoId);
      S.fs={q:"",tipo:e?eqParts(e).tipo:"",resueltas:true,desdeOt:id};S.view="historial";S.histTab="fallas";render();window.scrollTo(0,0);
      const sim=similares(o.desc,o.equipoId,"ot"+o.id,20);
      const box=$("#fs-res-box");if(box)box.innerHTML='<p class="hint" style="margin:0 0 8px">Fallas resueltas parecidas a: <b>'+esc(o.desc)+'</b>'+(e?' · mismo tipo de equipo primero':'')+'. Escribí palabras arriba para una búsqueda propia.</p>'+(sim.length?'<div class="list">'+sim.map(c=>casoCard(c,palabras(o.desc))).join("")+'</div>':'<div class="empty"><p>No se encontraron fallas resueltas parecidas.</p></div>');
      break}
    case "bajas":S.verBajas=!S.verBajas;render();break;
    case "falla":formFalla(null,id||null);break;
    case "ot-edit":formFalla(S.ot.get(id));break;
    case "ot-close":formCerrarOT(S.ot.get(id));break;
    case "ot-start":moverOT(id,"En curso");break;
    case "ot-ver":verOT(id);break;
    case "ot-mover":{const sel=$("#ov-dest");if(sel&&sel.value)moverOT(id,sel.value);break}
    case "kb-tipo":S.kbTipo=b.dataset.k;render();break;
    case "mover":formMover(S.eq.get(id));break;
    case "baja":formBaja(S.eq.get(id));break;
    case "reactivar":b.disabled=true;await reactivar(S.eq.get(id));break;
    case "cod-new":formCodigo(b.dataset.k);break;
    case "cuenta":document.body.classList.remove("side-open");if(window.PM_CUENTA)window.PM_CUENTA(b.dataset.k);break;
    case "side-open":document.body.classList.add("side-open");break;
    case "side-close":document.body.classList.remove("side-open");break;
    case "ayuda":document.body.classList.remove("side-open");ayuda();break;
    case "scan-qr":startScan();break;
    case "scan-stop":stopScan();render();break;
    case "scan-nfc":leerNFC();break;
    case "scan-code":{const v=val("sc-code");if(v)abrirToken(v);break}
    case "nfc-write":grabarNFC(b.dataset.link);break;
    case "cod-ren":if(b.dataset.k==="tipos")formEditTipo(id);else formEditCodigo(b.dataset.k,id);break;
    case "tipo-del":formDelTipo(id);break;
    case "cfgtab":S.cfgTab=b.dataset.k;render();break;
    case "cfg-pub":{const v=val("cfg-pub");if(v&&!/^https:\/\//i.test(v)){toast("La dirección tiene que empezar con https://");break}
      const cfg=cfgCopy();if(v)cfg.publicUrl=v;else delete cfg.publicUrl;
      try{await S.db.doc("config/codigos").set(cfg);toast("Dirección guardada")}catch(x){writeErr(x)}break}
    case "close-rep":{const r=S.re.find(x=>x.id===id);if(r)formCierre(r);break}
    case "inf-dl":{const c=$("#inf-rem");S.infRem=c?c.checked:true;save("Informe_mantenimiento_"+S.mes+(S.empresa?"_"+S.empresa:"")+".html",printableInforme(S.infRem));break}
    case "inf-rem-dl":{const d=reportData(S.mes);if(!d.regs.length){toast("No hay intervenciones en "+mesLabel(S.mes)+".");break}
      save("Remitos_mantenimiento_"+S.mes+(S.empresa?"_"+S.empresa:"")+".html",'<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Remitos '+esc(mesLabel(S.mes))+'</title><style>'+REMITO_CSS+'body{font-family:Arial,sans-serif;color:#111;margin:22px;font-size:12px}</style></head><body>'+remitosHTML(d,false)+'</body></html>');break}
    case "inf-save":{if(!canW()){toast("Tu usuario es de solo lectura.");break}b.disabled=true;
      try{await S.db.doc("informes/"+informeKey()).set({mes:S.mes,empresa:S.empresa||"todas",texto:$("#inf-nota").value.trim(),actualizado:new Date().toISOString(),porId:S.me&&S.me.id||null});S.infDraft=null;toast("Conclusiones guardadas")}catch(x){writeErr(x)}
      b.disabled=false;break}
    case "man-new":formManual(null,id||null);break;
    case "man-edit":formManual(S.ma.get(id));break;
    case "man-del":confirmManDel(S.ma.get(id));break;
    case "man-del-ok":{const m=S.ma.get(id);b.disabled=true;try{await S.db.doc("manuales/"+id).delete();if(m&&m.assetId&&S.assets)try{await S.assets.delete(m.assetId)}catch(_){}closeModal();toast("Manual borrado");render()}catch(x){writeErr(x);b.disabled=false}break}
    case "tag":showTag(S.eq.get(id));break;
    case "copy-link":{const inp=$("#tag-link");try{await navigator.clipboard.writeText(inp.value);toast("Link copiado")}catch(_){inp.focus();inp.select();toast("Seleccioné el link: copialo con Ctrl+C o mantené presionado")}break}
    case "dl-tag":{const e=S.eq.get(id);save("Etiqueta_"+safe(e.codigo)+".html",printableTags([e]));break}
    case "tags-all":{const list=[...S.eq.values()].filter(e=>isActivo(e)&&(!S.empresa||e.empresa===S.empresa)).sort((a,c)=>String(a.codigo).localeCompare(String(c.codigo)));if(!list.length){toast("No hay equipos para etiquetar.");break}save("Etiquetas_equipos"+(S.empresa?"_"+S.empresa:"")+".html",printableTags(list));break}
    case "ck-toggle":toggleItem(b.dataset.eq,id);break;
    case "ck-plan":b.disabled=true;await itemToPlan(b.dataset.eq,id);render();break;
    case "ck-edit":formChecklist(id,false);break;
    case "ck-ai":formChecklist(id,true);break;
    case "ck-ai-run":suggestAI(id);break;
    case "ck-row-add":{$("#ck-rows").insertAdjacentHTML("beforeend",ckRow());const ins=$("#ck-rows").lastElementChild.querySelector(".er-t");if(ins)ins.focus();break}
    case "ck-row-del":b.closest(".ck-er").remove();break;
    case "ck-dl":{const e=S.eq.get(id);save("Checklist_"+safe(e.codigo)+".html",printableChecklist(e,S.ck.get(id)||{items:[]}));break}
    case "csv":save("Historial_mantenimiento_"+todayStr()+".csv",csv());break;
  }
});
document.addEventListener("keydown",ev=>{if(ev.key!=="Escape")return;const fc=$('#firma-root [data-act="firma-cancel"]');if(fc){fc.click();return}closeModal()});
$("#btn-new-eq").addEventListener("click",()=>{if(!S.db){toast("Sin conexión con la base de datos.");return}if(!S.isAdmin){toast("Solo un administrador puede crear equipos.");return}formEquipo()});
document.addEventListener("change",ev=>{if(ev.target&&ev.target.id==="inf-mes"&&ev.target.value){S.mes=ev.target.value;render()}
  if(ev.target&&(ev.target.id==="fs-tipo"||ev.target.id==="fs-res")){S.fs=Object.assign({},S.fs,{tipo:$("#fs-tipo").value,resueltas:$("#fs-res").checked});const b=$("#fs-res-box");if(b)b.innerHTML=resultadosFallas()}});
document.addEventListener("input",ev=>{if(ev.target&&ev.target.id==="fs-q"){S.fs=Object.assign({},S.fs,{q:ev.target.value});clearTimeout(render.fs);render.fs=setTimeout(()=>{const b=$("#fs-res-box");if(b)b.innerHTML=resultadosFallas()},150)}});
$("#f-empresa").addEventListener("change",ev=>{S.empresa=ev.target.value;render()});
$("#f-q").addEventListener("keydown",ev=>{if(ev.key!=="Enter")return;const v=ev.target.value.trim();const tok=v.includes("#")?v.split("#").pop():v;const e=findByToken(tok);
  if(e){ev.preventDefault();ev.target.value="";S.q="";S.view="equipo";S.eqId=e.id;S.eqTab=((S.ck.get(e.id)||{}).items||[]).length?"check":"plan";render();toast("Equipo identificado: "+e.codigo)}});
$("#f-q").addEventListener("input",ev=>{S.q=ev.target.value.trim();clearTimeout(render.t);render.t=setTimeout(render,150)});
try{const v=localStorage.getItem("pm-empresa");if(v){S.empresa=v;$("#f-empresa").value=v}}catch(_){}
$("#f-empresa").addEventListener("change",ev=>{try{localStorage.setItem("pm-empresa",ev.target.value)}catch(_){}});

/* ---------- datos ---------- */
render();
const use=window.claude&&window.claude.use?window.claude.use.bind(window.claude):null;
if(!use){S.dbState="sin";render()}
else{
  use("downloads").then(d=>{S.dl=d}).catch(()=>{});
  use("user").then(async u=>{S.user=u;if(!u){applyRole();return}
    try{S.me=await u.me();const own=!!(await u.isOwner());S.isAdmin=own||!!(await u.canEdit());const cw=await u.can("data.write");S.canWrite=(own||S.isAdmin)?true:(cw===null?null:!!cw)}catch(_){}
    applyRole();if(!$("#modal-root").innerHTML)render()}).catch(()=>{});
  use("assets").then(a=>{S.assets=a}).catch(()=>{});
  use("sample").then(s=>{S.smp=s;if(s&&S.view==="equipo"&&S.eqTab==="check"&&!$("#modal-root").innerHTML)render()}).catch(()=>{});
  use("db").then(db=>{
    if(!db){S.dbState="sin";render();return}
    S.db=db;S.dbState="ok";
    const fail=()=>{toast("Se cortó la conexión con los datos. Cerrá y volvé a abrir la aplicación.")};
    db.collection("equipos").onSnapshot(s=>{S.eq=new Map(s.docs.map(d=>[d.id,Object.assign({id:d.id},d.data())]));S.loaded.eq=true;render();if(pendingTok)openFromHash()},fail);
    db.collection("tareas").onSnapshot(s=>{S.ta=new Map(s.docs.map(d=>[d.id,Object.assign({id:d.id},d.data())]));S.loaded.ta=true;render();syncPrev()},fail);
    applyRole();
    db.collection("ots").onSnapshot(s=>{S.ot=new Map(s.docs.map(d=>[d.id,Object.assign({id:d.id},d.data())]));S.loaded.ot=true;render();syncPrev()},fail);
    db.doc("config/codigos").onSnapshot(d=>{S.cfg=d.exists?d.data():null;applyCfg();if(!$("#modal-root").innerHTML)render()},fail);
    db.collection("manuales").onSnapshot(s=>{S.ma=new Map(s.docs.map(d=>[d.id,Object.assign({id:d.id},d.data())]));render()},fail);
    db.collection("informes").onSnapshot(s=>{S.inf=new Map(s.docs.map(d=>[d.id,d.data()]));if(S.view!=="informe")return;const ta=$("#inf-nota");if(ta&&document.activeElement===ta)return;render()},fail);
    db.collection("checklists").onSnapshot(s=>{S.ck=new Map(s.docs.map(d=>[d.id,Object.assign({id:d.id},d.data())]));if(!$("#modal-root").innerHTML||S.view!=="equipo")render()},fail);
    db.collection("registros").orderBy("fecha","desc").limit(1000).onSnapshot(s=>{S.re=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded.re=true;render()},fail);
  }).catch(()=>{S.dbState="sin";render()});
}
window.addEventListener("hashchange",openFromHash);
openFromHash();
setInterval(()=>{syncPrev();if(!$("#modal-root").innerHTML)render()},60*60*1000);
setInterval(()=>{if(!$("#modal-root").innerHTML&&(S.view==="tablero"||S.view==="equipo")&&openOts().length)render()},60*1000);
})();
</script>
